<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Dynamic SRS</title>
    <meta name="description" content="Dynamic SRS — a fresh workspace for AI-assisted requirements engineering.">
    <base href="<%= basePath %>">
    <script>
      try {
        const saved = localStorage.getItem('dynamic-srs.theme');
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
